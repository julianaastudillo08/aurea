<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juliana — Joyas</title>
  <meta name="description" content="Catálogo de joyas Juliana. Pedidos por WhatsApp." />
  <meta property="og:title" content="Juliana — Joyas" />
  <meta property="og:description" content="Piezas seleccionadas. Pedidos por WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1b1511;
      --soft: #6f645a;
      --line: #e6ddd2;
      --pearl: #f6f1ea;
      --paper: #fffdf9;
      --champagne: #c2a36b;
      --champagne-deep: #9a7a3f;
      --espresso: #120e0b;
      --wa: #128c7e;
      --wa-bright: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--pearl);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; border: 0; background: none; cursor: pointer; }
    img { display: block; max-width: 100%; }

    /* Atmospheric field */
    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(194, 163, 107, 0.22), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 30%, rgba(255, 255, 255, 0.7), transparent 50%),
        radial-gradient(ellipse 50% 35% at 0% 80%, rgba(194, 163, 107, 0.12), transparent 55%),
        linear-gradient(180deg, #faf6f0 0%, #f3ebe1 48%, #efe6db 100%);
    }
    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c2a36b' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .page { position: relative; z-index: 1; }

    /* Nav */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px) saturate(1.2);
      background: rgba(246, 241, 234, 0.78);
      border-bottom: 1px solid rgba(27, 21, 17, 0.06);
    }
    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .mark {
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
    }
    .mark em {
      display: block;
      margin-top: 0.28rem;
      font-style: italic;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      font-weight: 500;
      color: var(--champagne-deep);
      text-transform: uppercase;
    }
    .nav-wa {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.7rem 1.05rem;
      border-radius: 999px;
      background: var(--espresso);
      color: #f7f1e8;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .nav-wa:hover { transform: translateY(-1px); background: #2a211b; }
    .nav-wa svg { color: var(--wa-bright); }

    /* Hero — one composition */
    .hero-shell {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: min(72vh, 640px);
      display: grid;
      align-items: end;
      margin-bottom: 0.4rem;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center 30%;
      transform: scale(1.04);
      filter: saturate(0.92) contrast(0.98);
      animation: slowZoom 18s ease-in-out infinite alternate;
    }
    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(246,241,234,0.55) 0%, rgba(246,241,234,0.78) 42%, rgba(246,241,234,0.96) 78%, var(--pearl) 100%),
        radial-gradient(ellipse 70% 55% at 50% 20%, rgba(194,163,107,0.18), transparent 65%);
    }
    .hero {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(3.2rem, 8vw, 5.5rem) 1.25rem 2rem;
      text-align: center;
      animation: fadeRise 0.9s ease both;
    }
    .hero-brand {
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: clamp(3.4rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--espresso);
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
    }
    .hero-rule {
      width: 56px;
      height: 1px;
      margin: 1.35rem auto 1.15rem;
      background: linear-gradient(90deg, transparent, var(--champagne), transparent);
      animation: shimmerLine 2.8s ease-in-out infinite;
    }
    .hero h1 {
      font-family: "Bodoni Moda", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(1.4rem, 3.4vw, 1.95rem);
      color: #4d433a;
      letter-spacing: 0.01em;
      margin-bottom: 0.85rem;
    }
    .hero p {
      max-width: 28rem;
      margin: 0 auto 1.6rem;
      color: #5b5148;
      font-size: 1.02rem;
      line-height: 1.65;
      font-weight: 450;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.98rem 1.5rem;
      border-radius: 999px;
      background: var(--espresso);
      color: #f8f2ea;
      font-size: 0.9rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      box-shadow: 0 14px 34px rgba(27, 21, 17, 0.22);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(27, 21, 17, 0.24);
    }
    .hero-cta span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--wa-bright);
      box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.2);
      animation: pulse 2s ease infinite;
    }
    /* Catalog shell */
    .catalog {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1rem 5.5rem;
    }
    .toolbar {
      background: rgba(255, 253, 249, 0.82);
      border: 1px solid rgba(27, 21, 17, 0.06);
      border-radius: 22px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(27, 21, 17, 0.04);
      animation: fadeRise 0.9s ease 0.12s both;
    }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 0.95rem 1.05rem;
      outline: none;
      font-size: 0.95rem;
      color: var(--ink);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search::placeholder { color: #a09488; }
    .search:focus {
      border-color: rgba(194, 163, 107, 0.7);
      box-shadow: 0 0 0 4px rgba(194, 163, 107, 0.14);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.85rem;
    }
    .filter-btn {
      padding: 0.48rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: 0.18s ease;
    }
    .filter-btn:hover {
      border-color: var(--champagne);
      color: var(--ink);
    }
    .filter-btn.active {
      background: var(--espresso);
      border-color: var(--espresso);
      color: #f6f0e8;
    }
    .meta {
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: var(--soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.35rem; }
      .toolbar { padding: 1.15rem 1.2rem; }
    }
    @media (min-width: 1000px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem; }
    }

    .card {
      background: var(--paper);
      border: 1px solid rgba(194, 163, 107, 0.18);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(27, 21, 17, 0.035);
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
      animation: fadeRise 0.7s ease both;
    }
    .card:hover {
      transform: translateY(-7px);
      border-color: rgba(194, 163, 107, 0.45);
      box-shadow: 0 24px 50px rgba(27, 21, 17, 0.1);
    }
    .media {
      position: relative;
      aspect-ratio: 1;
      margin: 0.55rem 0.55rem 0;
      border-radius: 16px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.9), transparent 45%),
        linear-gradient(165deg, #f4ebe0, #e8ddd0);
      overflow: hidden;
    }
    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    }
    .card:hover .media img { transform: scale(1.05); }
    .badge {
      position: absolute;
      top: 0.65rem;
      left: 0.65rem;
      z-index: 2;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 253, 249, 0.94);
      border: 1px solid rgba(194, 163, 107, 0.45);
      color: var(--champagne-deep);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .info {
      padding: 0.95rem 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      flex: 1;
    }
    .code {
      font-size: 0.66rem;
      color: #9a8d81;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .name {
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.28;
      text-transform: capitalize;
      min-height: 2.55em;
      letter-spacing: 0.01em;
    }
    .price {
      margin-top: auto;
      padding-top: 0.4rem;
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ink);
    }
    .buy {
      margin-top: 0.75rem;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.78rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(194, 163, 107, 0.55);
      background: transparent;
      color: var(--champagne-deep);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease, border-color 0.25s ease;
    }
    .buy:hover {
      background: var(--espresso);
      border-color: var(--espresso);
      color: #f7f1e8;
      transform: translateY(-1px);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--soft);
      font-family: "Bodoni Moda", Georgia, serif;
      font-style: italic;
      font-size: 1.25rem;
    }

    .footer {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.25rem 2.8rem;
      text-align: center;
      color: var(--soft);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }
    .footer strong {
      display: block;
      margin-bottom: 0.35rem;
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    @keyframes fadeRise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes shimmerLine {
      0%, 100% { opacity: 0.45; transform: scaleX(0.85); }
      50% { opacity: 1; transform: scaleX(1); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.18); }
      50% { box-shadow: 0 0 0 7px rgba(37, 211, 102, 0.08); }
    }
    @keyframes slowZoom {
      from { transform: scale(1.02); }
      to { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="page">
    <header class="nav">
      <div class="nav-inner">
        <div class="mark">Juliana<em>joyas</em></div>
        <a class="nav-wa" id="waTop" href="#" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11 11 0 0 0 2.1 17.2L1 23l5.9-1.1A11 11 0 0 0 20.5 3.5zm-8.6 17a9.1 9.1 0 0 1-4.6-1.3l-.3-.2-3.5.7.7-3.4-.2-.3a9.1 9.1 0 1 1 7.9 4.5zm5-6.8c-.3-.1-1.6-.8-1.9-.9s-.4-.1-.6.1-.7.9-.8 1-.3.2-.6.1a7.4 7.4 0 0 1-2.2-1.4 8.2 8.2 0 0 1-1.5-1.9c-.2-.3 0-.4.1-.6l.5-.6c.1-.2.1-.3 0-.5l-.9-2.1c-.2-.6-.5-.5-.6-.5h-.5c-.2 0-.5.1-.8.4s-1 1-1 2.4 1.1 2.8 1.2 3 .2.3 2.1 3.3a12 12 0 0 0 3.4 2.4c1.2.4 1.7.4 2.3.3.7-.1 1.6-.7 1.8-1.3s.2-1.2.1-1.3-.2-.2-.5-.3z"/></svg>
          WhatsApp
        </a>
      </div>
    </header>

    <section class="hero-shell">
      <div class="hero-bg" id="heroBg" aria-hidden="true"></div>
      <div class="hero">
        <div class="hero-brand">Juliana</div>
        <div class="hero-rule" aria-hidden="true"></div>
        <h1>Piezas con luz propia</h1>
        <p>Elige tu favorita y escríbeme. Te confirmo disponibilidad y te ayudo con tu pedido.</p>
        <a class="hero-cta" id="waHero" href="#" target="_blank" rel="noopener">
          <span aria-hidden="true"></span>
          Pedir por WhatsApp
        </a>
      </div>
    </section>

    <section class="catalog">
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Buscar por nombre o código…" autocomplete="off" />
        <div class="filters" id="filters"></div>
        <div class="meta" id="meta"></div>
      </div>
      <main class="grid" id="grid"></main>
    </section>

    <footer class="footer">
      <strong>Juliana</strong>
      WhatsApp +57 314 356 2274
    </footer>
  </div>

  <script src="./productos.js"></script>
  <script>
    const { whatsapp, productos } = window.CATALOGO;
    const money = (n) =>
      new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n);
    const titleCase = (s) =>
      s.toLocaleLowerCase("es-CO").replace(/(^|[\s/+-])(\S)/g, (_, a, b) => a + b.toLocaleUpperCase("es-CO"));

    const categoryOf = (name) => {
      const u = name.toUpperCase();
      if (u.includes("SEMANARIO")) return "Semanarios";
      if (u.includes("TOBILLERA")) return "Tobilleras";
      if (u.includes("PULSERA") || u.includes("BRAZALETE")) return "Pulseras";
      if (u.includes("COLLAR") || u.includes("CAMANDULA") || u.includes("JUEGO")) return "Collares";
      if (u.includes("CANDONGA") || u.includes("EAR CUFF") || u.includes("ARETE") || u.includes("TOPO") || u.includes("DUO") || u.includes("TRIO")) return "Aretes";
      return "Otros";
    };
    productos.forEach((p) => { p.category = categoryOf(p.name); });

    const cats = ["Todos", ...new Set(productos.map((p) => p.category))];
    let activeCat = "Todos";
    let query = "";

    const waBase = `https://wa.me/${whatsapp}`;
    const greeting = "Hola Juliana! Vi tu catálogo y quiero hacer un pedido.";
    ["waTop", "waHero"].forEach((id) => {
      document.getElementById(id).href = `${waBase}?text=${encodeURIComponent(greeting)}`;
    });

    // Foto limpia (sin tarjeta/logo) para el hero
    const heroPick =
      productos.find((p) => p.code === "31012278") ||
      productos.find((p) => /topo|arete|duo/i.test(p.name) && !/semanario/i.test(p.name)) ||
      productos[0];
    if (heroPick) {
      document.getElementById("heroBg").style.backgroundImage = `url("${heroPick.image}?v=3")`;
    }

    const buyLink = (p) => {
      const msg =
        `Hola Juliana! Quiero comprar:\n` +
        `• ${titleCase(p.name)}\n` +
        `• Código: ${p.code}\n` +
        `• Precio: ${money(p.price)}\n\n` +
        `¿Me confirmas disponibilidad?`;
      return `${waBase}?text=${encodeURIComponent(msg)}`;
    };

    const filtersEl = document.getElementById("filters");
    cats.forEach((cat) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-btn" + (cat === activeCat ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        activeCat = cat;
        [...filtersEl.children].forEach((b) => b.classList.toggle("active", b.textContent === cat));
        render();
      });
      filtersEl.appendChild(btn);
    });

    document.getElementById("search").addEventListener("input", (e) => {
      query = e.target.value.trim().toLowerCase();
      render();
    });

    function render() {
      const list = productos.filter((p) => {
        const okCat = activeCat === "Todos" || p.category === activeCat;
        const okQ = !query || p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);
        return okCat && okQ;
      });
      document.getElementById("meta").textContent = `${list.length} piezas`;
      const grid = document.getElementById("grid");
      if (!list.length) {
        grid.innerHTML = `<div class="empty">No encontré esa pieza</div>`;
        return;
      }
      grid.innerHTML = list.map((p, i) => `
        <article class="card" style="animation-delay:${Math.min(i, 16) * 35}ms">
          <div class="media">
            ${p.gift ? `<span class="badge">Campaña</span>` : ""}
            <img src="${p.image}?v=3" alt="${titleCase(p.name)}" loading="lazy" />
          </div>
          <div class="info">
            <div class="code">${p.code}</div>
            <h2 class="name">${titleCase(p.name)}</h2>
            <div class="price">${money(p.price)}</div>
            <a class="buy" href="${buyLink(p)}" target="_blank" rel="noopener">Comprar</a>
          </div>
        </article>`).join("");
    }
    render();
  </script>
</body>
</html>
